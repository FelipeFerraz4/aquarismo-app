<app-post-header-type1 [title]="currentPost?.title ?? ''" [description]="currentPost?.description ?? ''"
    [imageUrl]="currentPost?.image ?? ''" [author]="currentPost?.author ?? ''" [date]="currentPost?.date ?? ''"
    [readingTime]="currentPost?.readingTime ?? ''" [category]="currentPost?.category ?? ''" />

<section class="article-section">
    <article class="content">
        <div class="image-block">
        </div>
    </article>
</section>



<app-related-posts [recommendedPosts]="recommended" [lastPosts]="latest" />
